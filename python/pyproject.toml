[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "bio-tools"
description = "Install and inspect computational biology tools using the bio_tools Rust library"
requires-python = ">=3.10"
authors = [{ name = "David O'Connor", email = "the_alchemist@fastmail.com" }]
readme = "PYPI_README.md"
license = { file = "PYPI_LICENSE" }
keywords = ["biology", "bioinformatics", "installer", "scientific-computing"]
dynamic = ["version"]

classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
homepage = "https://github.com/David-OConnor/bio_tools"
repository = "https://github.com/David-OConnor/bio_tools"

[tool.maturin]
module-name = "bio_tools"
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
